name: Build APK

# Manual only: press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME), so no setup-android step.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show what we are building
        run: |
          ls -la launcher
          ls -la launcher/app/src/main/res/values || true

      - name: Build debug APK
        working-directory: launcher
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find the APK
        run: find launcher -name "*.apk" -print

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/**/build/outputs/apk/debug/*.apk
